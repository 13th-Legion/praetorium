<style>
    .s4-wrap { max-width: 1080px; margin: 0 auto; }
    .s4-header { margin-bottom: 24px; }
    .s4-header h2 { color: #d4a537; margin: 0 0 4px; }
    .s4-header .subtitle { color: #888; font-size: 13px; }
    .s4-back { display: inline-block; margin-bottom: 16px; color: #d4a537; font-size: 13px; text-decoration: none; }
    .s4-back:hover { text-decoration: underline; }

    .s4-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .s4-nav a {
        padding: 7px 14px; border-radius: 4px; font-size: 13px; font-weight: 600;
        color: #ccc; text-decoration: none; background: #16213e; border: 1px solid #333;
    }
    .s4-nav a:hover { border-color: #d4a537; color: #d4a537; }

    .s4-card {
        background: #16213e; border: 1px solid #333; border-radius: 8px;
        margin-bottom: 24px; padding: 16px 20px;
    }
    .s4-card h3 {
        margin: 0 0 12px; font-family: 'Oswald', sans-serif; font-size: 0.95rem;
        text-transform: uppercase; letter-spacing: 0.05em; color: #d4a537;
    }
    .s4-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

    .s4-flash {
        background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.4);
        color: #28a745; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px;
        font-size: 14px; font-weight: 600;
    }
    .s4-err {
        background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.4); color: #dc3545;
    }

    .s4-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .s4-table th { text-align: left; color: #888; font-weight: 600; padding: 8px 8px; border-bottom: 1px solid #333; }
    .s4-table td { padding: 8px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #e0e0e0; vertical-align: top; }
    .s4-table tr:last-child td { border-bottom: none; }

    .s4-input, .s4-select, .s4-textarea {
        background: #0f1626; border: 1px solid #333; color: #e0e0e0;
        padding: 8px 12px; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box;
    }
    .s4-textarea { min-height: 70px; resize: vertical; }
    .s4-field { margin-bottom: 10px; }
    .s4-field label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }

    .s4-btn {
        padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer;
        border: 1px solid rgba(40,167,69,0.4); background: rgba(40,167,69,0.15); color: #28a745;
    }
    .s4-btn:hover { background: rgba(40,167,69,0.3); }
    .s4-btn-sm { padding: 4px 10px; font-size: 12px; }
    .s4-btn-mut { background: rgba(220,53,69,0.15); border-color: rgba(220,53,69,0.4); color: #dc3545; }
    .s4-btn-mut:hover { background: rgba(220,53,69,0.3); }
    .s4-btn-warn { background: rgba(255,193,7,0.15); border-color: rgba(255,193,7,0.4); color: #ffc107; }
    .s4-btn-warn:hover { background: rgba(255,193,7,0.3); }

    .s4-inline { display: inline-block; }
    .s4-muted { color: #777; font-size: 12px; }
    .s4-badge {
        display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
    }
    .badge-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
    .badge-approved { background: rgba(40,167,69,0.15); color: #28a745; }
    .badge-reimbursed { background: rgba(40,167,69,0.3); color: #7ee2a0; }
    .badge-rejected, .badge-denied { background: rgba(220,53,69,0.15); color: #dc3545; }
    .badge-purchased { background: rgba(23,162,184,0.15); color: #17a2b8; }
    .badge-received { background: rgba(40,167,69,0.3); color: #7ee2a0; }
    .badge-available { background: rgba(40,167,69,0.15); color: #28a745; }
    .badge-checked_out { background: rgba(255,193,7,0.15); color: #ffc107; }
    .badge-retired, .badge-maintenance { background: #333; color: #999; }
    .badge-submitted, .badge-accepted_pending_dropoff { background: rgba(255,193,7,0.15); color: #ffc107; }

    .s4-check { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; font-size: 13px; color: #aaa; }
    .s4-check input { accent-color: #d4a537; }

    .s4-empty { text-align: center; padding: 20px; color: #555; font-size: 13px; font-style: italic; }
    .s4-receipt { color: #17a2b8; text-decoration: none; font-size: 12px; }
</style>
