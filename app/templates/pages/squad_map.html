{% extends "base.html" %}
{% block title %}Squad / Fireteam Map{% endblock %}
{% block content_class %}map-page{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  main.content.map-page { padding: 0; max-width: none; width: 100%; }
  .map-subtitle { background: #16213e; color: #999; font-size: 12px; padding: 6px 20px; border-bottom: 1px solid #333; }
  #map { height: calc(100vh - 120px); width: 100%; background: #0f1220; }
  .legend { background: rgba(22,33,62,0.94); padding: 10px 14px; border-radius: 6px; font-size: 12px; color: #ccc; line-height: 1.75; }
  .legend .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .legend .sl { color: #ffd54f; }
</style>
{% endblock %}

{% block content %}
<div class="map-subtitle">Proposed squad / fireteam reorganization &mdash; active + recruit members &middot; <span style="color:#ffd54f;">&#9733;</span> = squad leader</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SQUADS = {{ squads | tojson }};
const TEAM_COLORS = {{ team_colors | tojson }};
const TEAM_LIST = {{ geo_list | tojson }};
const TEAM_DIRS = ["N", "NE", "E/SE", "S", "SW/W", "NW"];
const ZONE_START = 330;
const ZONE_SIZE = 60;
const CENTER = {{ center | tojson }};

const map = L.map('map').setView([CENTER.lat, CENTER.lon], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Squad-territory pie slices (same 6-zone scheme as the roster map)
function bearingToPoint(lat, lon, bearing, distKm) {
  const R = 6371;
  const d = distKm / R;
  const brng = bearing * Math.PI / 180;
  const lat1 = lat * Math.PI / 180;
  const lon1 = lon * Math.PI / 180;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
  const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
  return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
}

function generateZonePolygon(startBearing, endBearing, center, radiusKm) {
  const pts = [[center.lat, center.lon]];
  const steps = 30;
  for (let i = 0; i <= steps; i++) {
    const b = startBearing + (((endBearing - startBearing + 360) % 360) / steps) * i;
    pts.push(bearingToPoint(center.lat, center.lon, b % 360, radiusKm));
  }
  pts.push([center.lat, center.lon]);
  return pts;
}

const zoneLayer = L.layerGroup();
TEAM_LIST.forEach(function (team, i) {
  const startB = (ZONE_START + i * ZONE_SIZE) % 360;
  const endB = (startB + ZONE_SIZE) % 360;
  const polygon = generateZonePolygon(startB, endB, CENTER, 170);
  const color = TEAM_COLORS[team] || '#666';
  L.polygon(polygon, {
    color: color + 'aa',
    fillColor: color + '44',
    fillOpacity: 0.15,
    weight: 2,
    dashArray: '5,5',
  }).addTo(zoneLayer).bindPopup('<strong>' + team + ' (' + TEAM_DIRS[i] + ')</strong><br>' + startB + '° – ' + endB + '°');
});
zoneLayer.addTo(map);

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  let html = '<strong>Legend</strong><br>';
  for (const s of SQUADS) {
    if (s.squad_leader) {
      html += '<span class="sl">&#9733; <b>' + s.team + ' Squad</b></span> &mdash; ' + s.squad_leader.name + '<br>';
    }
    for (const ft of s.fireteams) {
      html += '<span class="swatch" style="background:' + ft.color + '"></span>' + ft.name + '<br>';
    }
  }
  div.innerHTML = html;
  return div;
};
legend.addTo(map);

for (const s of SQUADS) {
  if (s.squad_leader) {
    const sl = s.squad_leader;
    L.circleMarker([sl.lat, sl.lon], { radius: 9, color: '#111', weight: 2, fillColor: '#ffb300', fillOpacity: 1 })
      .addTo(map)
      .bindPopup('<b>' + s.team + ' Squad Leader</b><br>' + sl.name);
  }
  for (const ft of s.fireteams) {
    for (const m of ft.members) {
      const opts = m.isolated
        ? { radius: 7, color: '#ff9800', weight: 2, fillColor: '#ff9800', fillOpacity: 0.9 }
        : { radius: 6, color: '#111', weight: 1, fillColor: ft.color, fillOpacity: 0.9 };
      const popup = '<b>' + ft.name + '</b><br>' + m.name
        + (m.isolated ? '<br><b>⚠ isolated</b> — ' + m.isolated_km + ' km from nearest fireteam peer' : '');
      L.circleMarker([m.lat, m.lon], opts)
        .addTo(map)
        .bindPopup(popup);
    }
  }
}

setTimeout(function () { map.invalidateSize(); }, 100);
</script>
{% endblock %}
