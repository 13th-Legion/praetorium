{% extends "base.html" %}
{% block title %}{{ doc_title }}{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;">
        <h1 style="margin: 0;">📄 {{ doc_title }}</h1>
        <a href="/profile" style="font-size: 13px; color: #d4a537; text-decoration: none;">&larr; Back to My Profile</a>
    </div>

    <!-- Document content (read-only) -->
    <div class="doc-content" style="
        background: #fafafa; border: 1px solid #ddd; border-radius: 8px;
        padding: 28px; margin-bottom: 16px;
        font-size: 14px; line-height: 1.7; color: #1a1a1a;
    ">
        {{ doc_content | safe }}
    </div>

    <p style="font-size: 12px; color: #999;">
        This is a read-only copy for reference. Official versions are maintained by unit S1.
    </p>
</div>
{% endblock %}
