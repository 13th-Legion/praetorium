[alembic]
script_location = migrations
# Ensure the project root (containing the `app` package) is importable when
# alembic runs env.py, regardless of PYTHONPATH. Path is relative to this ini file.
prepend_sys_path = .
# sqlalchemy.url is set dynamically from DATABASE_URL_SYNC env var in migrations/env.py
sqlalchemy.url = postgresql+psycopg2://localhost/praetorium

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
