name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praetorium
          POSTGRES_PASSWORD: praetorium
          POSTGRES_DB: praetorium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praetorium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-prod-000000000000000
      DEBUG: "true"
      NEWSLETTER_DATA_DIR: /tmp/nl
      # App runtime + tests point at the ephemeral service DB.
      DATABASE_URL: postgresql+asyncpg://praetorium:praetorium@localhost:5432/praetorium_test
      DATABASE_URL_SYNC: postgresql+psycopg2://praetorium:praetorium@localhost:5432/praetorium_test
      TEST_DATABASE_URL: postgresql+asyncpg://praetorium:praetorium@localhost:5432/praetorium_test
      NC_CLIENT_ID: test
      NC_CLIENT_SECRET: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint tests (blocking — must stay clean)
        run: ruff check tests

      - name: Lint app (advisory — legacy backlog, ratchet up over time)
        run: ruff check app || true

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration drift check (models vs head)
        run: alembic check

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt || true   # advisory (don't block on transitive CVEs yet)
