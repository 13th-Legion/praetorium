services:
  app:
    build: .
    container_name: praetorium-app
    restart: always
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://praetorium:${POSTGRES_PASSWORD}@db:5432/praetorium
      - DATABASE_URL_SYNC=postgresql+psycopg2://praetorium:${POSTGRES_PASSWORD}@db:5432/praetorium
      # No fallback: the app hard-fails at startup if SECRET_KEY is unset/weak
      # (see config.py). Must be provided via .env in production.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (strong 32+ char value)}
      - NC_URL=https://cloud.13thlegion.org
      - NC_CLIENT_ID=${NC_CLIENT_ID}
      - NC_CLIENT_SECRET=${NC_CLIENT_SECRET}
      - NC_API_USER=${NC_API_USER:-portal-svc}
      - NC_API_PASSWORD=${NC_API_PASSWORD}
      - APP_URL=https://portal.13thlegion.org
      - DEBUG=false
      - NC_SVC_USER=spooky
      - NC_SVC_PASS=${NC_SVC_PASS}
      - NC_TALK_USER=${NC_TALK_USER}
      - NC_TALK_PASS=${NC_TALK_PASS}
      - NC_PORTAL_SVC_USER=portal-svc
      - NC_PORTAL_SVC_PASS=${NC_PORTAL_SVC_PASS}
      - SMTP_HOST=172.21.0.1
      - SMTP_PORT=1025
      - SMTP_USER=admin@13thlegion.org
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=13th Legion <admin@13thlegion.org>
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_SECRET=${PAYPAL_SECRET}
      - VENMO_USERNAME=${VENMO_USERNAME:-xiiiventures}
      - VENMO_NOTE=${VENMO_NOTE:-13th Legion Donation}
      - PAYPAL_API_BASE=${PAYPAL_API_BASE:-https://api-m.paypal.com}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - library_data:/app/data/library
      - newsletter_data:/app/data/newsletter
    networks:
      - praetorium
    healthcheck:
      # Hits the DB-backed readiness probe so a wedged-but-listening app is
      # detected (a static /health can't catch that).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: praetorium-db
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praetorium"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: praetorium
      POSTGRES_USER: praetorium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - praetorium
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  library_data:
  newsletter_data:

networks:
  praetorium:
    driver: bridge
